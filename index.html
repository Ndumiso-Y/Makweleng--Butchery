    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XHT5NM2SD9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Enable automatic page_view tracking initially
      gtag('config', 'G-XHT5NM2SD9');

      // SPA Page View Tracking
      (function() {
        // Track page view function
        function trackPageView() {
          if (typeof window.gtag === 'function') {
            const pageData = {
              page_location: window.location.href,
              page_path: window.location.pathname + window.location.search + window.location.hash,
              page_title: document.title
            };
            gtag('event', 'page_view', pageData);
            console.log('📊 GA4 page_view tracked:', pageData);
          } else {
            console.warn('⚠️ gtag not ready yet');
          }
        }

        // Custom event for route changes
        function dispatchRouteChange() {
          window.dispatchEvent(new Event('route-change'));
        }

        // Wrap history.pushState
        const originalPushState = history.pushState;
        history.pushState = function() {
          originalPushState.apply(this, arguments);
          dispatchRouteChange();
        };

        // Wrap history.replaceState
        const originalReplaceState = history.replaceState;
        history.replaceState = function() {
          originalReplaceState.apply(this, arguments);
          dispatchRouteChange();
        };

        // Listen to popstate and hashchange
        window.addEventListener('popstate', dispatchRouteChange);
        window.addEventListener('hashchange', dispatchRouteChange);

        // Listen to our custom route-change event
        window.addEventListener('route-change', function() {
          setTimeout(trackPageView, 100);
        });

        // Track SPA route changes (in addition to automatic initial page_view)
        // Wait a bit to avoid duplicate initial page_view
        setTimeout(function() {
          console.log('✅ GA4 SPA tracking initialized');
        }, 2000);
      })();

      // Global event tracking helper
      window.trackEvent = function(eventName, eventParams) {
        if (typeof window.gtag === 'function') {
          gtag('event', eventName, eventParams || {});
          console.log('📊 GA4 event tracked:', eventName, eventParams);
        } else {
          console.warn('⚠️ gtag not available for event:', eventName);
        }
      };
    </script>
